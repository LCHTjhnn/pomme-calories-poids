<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7ef">
  <meta name="description" content="Pomme : votre carnet de calories, d’aliments favoris et de pesées. Sans compte, avec vos données sur votre appareil.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pomme">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Pomme — Calories & poids</title>
  <style>:root {
  color-scheme: light;
  --bg: #f6f7ef;
  --paper: #fff;
  --ink: #223d2b;
  --muted: #657361;
  --line: #dce4d5;
  --accent: #256044;
  --on: #fff;
  --soft: #e6eedb;
  --key: #edf1e6;
  --danger: #a33d32;
  --danger-soft: #faeee9;
  --shadow: 0 20px 70px #1a372610;
  --radius: 24px;
  --nav-height: 76px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-synthesis: none;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

*, *::before, *::after { box-sizing: border-box; }
html { min-width: 280px; scroll-padding-bottom: 120px; }
body {
  margin: 0;
  background: var(--soft);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button {
  cursor: pointer;
  min-height: 44px;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
button:disabled { cursor: default; opacity: .45; }
button:active:not(:disabled) { opacity: .78; }
button, input, select, textarea { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
a { color: var(--accent); text-underline-offset: 3px; }
button svg, .topbar svg { width: 20px; height: 20px; flex-shrink: 0; }
svg { vertical-align: middle; }
h1, h2, h3, p, figure { margin: 0; }
h1 { font-size: 30px; font-weight: 730; line-height: 1.15; letter-spacing: -1px; }
h2 { font-size: 19px; font-weight: 670; line-height: 1.3; letter-spacing: -.4px; }
h3 { font-size: 16px; font-weight: 650; line-height: 1.3; letter-spacing: -.2px; }
strong, b { font-weight: 650; }
[hidden] { display: none !important; }
.app {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0 auto;
  padding-bottom: calc(var(--nav-height) + env(safe-area-inset-bottom, 0px));
  background: var(--bg);
  box-shadow: var(--shadow);
}
.topbar {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 6px;
  padding: calc(19px + env(safe-area-inset-top, 0px)) 22px 18px;
}
.brand { display: inline-flex; align-items: center; align-self: flex-start; gap: 8px; min-width: 0; color: var(--ink); font-size: 40px; font-weight: 750; line-height: 1.12; letter-spacing: -1.2px; text-decoration: none; }
.brand-caption { display: flex; align-items: center; gap: 6px; margin-top: 5px; color: var(--muted); font-size: 12px; font-weight: 600; line-height: 1.3; letter-spacing: .6px; white-space: nowrap; }
.brand-icon { display: block; flex: 0 0 80px; width: 80px; height: 80px; border-radius: 20px; background: var(--soft); }
.brand a { color: inherit; text-decoration: none; }
.brand-logo-link { flex-shrink: 0; border-radius: 20px; }
.brand-name { display: block; width: fit-content; }
.local-device-indicator { display: inline-flex; flex: 0 0 44px; align-items: center; justify-content: flex-start; width: 44px; height: 44px; margin: -13px 0; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--accent); }
.topbar .local-device-indicator svg { width: 18px; height: 18px; }
.local-device-indicator.has-error { color: var(--danger); }
.profile-avatar { display: inline-grid; place-items: center; flex: 0 0 44px; width: 44px; height: 44px; padding: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--paper); font-size: 26px; line-height: 1; }
main#main { padding: 3px 22px 32px; outline: none; }
.home-profile { width: 100%; margin: 0 0 22px; padding: 13px 15px; border: 1px solid var(--line); border-radius: 20px; background: var(--paper); text-align: left; }
.home-profile-head { display: flex; align-items: center; gap: 12px; min-width: 0; }
.home-profile-avatar { display: grid; place-items: center; flex: 0 0 52px; width: 52px; height: 52px; border-radius: 17px; background: var(--soft); font-size: 34px; line-height: 1; }
.home-profile-identity { flex: 1; min-width: 0; }
.home-profile-identity > strong { display: block; font-size: 17px; line-height: 1.3; overflow-wrap: anywhere; }
.profile-weight { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; font-weight: 400; line-height: 1.4; font-variant-numeric: tabular-nums; }
.home-profile-head > svg { width: 18px; height: 18px; color: var(--muted); }
.app-footer { padding: 0 20px 22px; color: var(--muted); font-size: 10px; text-align: center; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.page-head > div { min-width: 0; }
.subtitle, .page-head p { margin-top: 5px; color: var(--muted); font-size: 13px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.row > *, .two-col > * { min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 11px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 24px 0 10px; }
.section-head h2, .section-head h3 { font-size: 17px; }
.section-head .text-btn { flex-shrink: 0; }
.icon-btn {
  display: inline-grid;
  place-items: center;
  flex-shrink: 0;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--paper);
}
.text-btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 8px 4px; border: 0; background: transparent; color: var(--accent); font-size: 13px; font-weight: 600; }
.primary, .secondary, .danger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 51px;
  padding: 12px 16px;
  border: 1px solid transparent;
  border-radius: 16px;
  font-size: 15px;
  font-weight: 650;
  text-align: center;
}
.primary { background: var(--accent); color: var(--on); }
.secondary { border-color: var(--line); background: var(--paper); color: var(--ink); }
.danger { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }
.text-btn.danger, .icon-btn.danger { width: auto; min-width: 44px; min-height: 44px; background: transparent; border: 0; color: var(--danger); }
.panel { margin: 16px 0; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
.panel > :first-child { margin-top: 0; }
.panel > :last-child { margin-bottom: 0; }
.notice { margin: 14px 0; padding: 13px 15px; border-radius: 15px; background: var(--soft); color: var(--ink); font-size: 13px; overflow-wrap: anywhere; }
.notice p + p { margin-top: 8px; }
.notice .text-btn { margin-top: 2px; padding-left: 0; }
.field { display: block; min-width: 0; margin: 17px 0; }
.field > label, label.field > span, .field > span { display: block; margin: 0 0 7px; color: var(--ink); font-size: 13px; font-weight: 550; }
.field input, .field select, .field textarea, input.dateinput {
  display: block;
  width: 100%;
  min-width: 0;
  max-width: 100%;
  min-height: 51px;
  padding: 12px 13px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--paper);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.35;
  box-shadow: none;
}
.field input::placeholder, .searchbox input::placeholder { color: var(--muted); opacity: .85; }
.field input[aria-invalid="true"] { border-color: var(--danger); }
.field input[type="date"], input.dateinput { -webkit-appearance: none; appearance: none; }
.field input[type="date"]::-webkit-date-and-time-value, input.dateinput::-webkit-date-and-time-value { text-align: left; min-height: 1.35em; }
.field small { display: block; margin-top: 7px; color: var(--muted); font-size: 12px; font-weight: 400; }
.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.two-col .field { margin-top: 12px; }
.datebar { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 8px; margin: -3px 0 17px; }
.datebar > label { min-width: 0; }
.datebar > .text-btn { grid-column: 1 / -1; justify-self: end; margin: -5px 0 -8px; }
.datebar .dateinput, .datebar input[type="date"] { display: block; width: 100%; min-width: 0; max-width: 100%; min-height: 44px; height: 44px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 13px; background: var(--paper); font-size: 16px; -webkit-appearance: none; appearance: none; }
.datebar input[type="date"]::-webkit-date-and-time-value { min-height: 1.35em; text-align: center; }
.datebar .icon-btn, .prevnext { width: 44px; min-width: 44px; height: 44px; border-radius: 13px; }
.prevnext { display: grid; place-items: center; padding: 0; border: 1px solid var(--line); background: var(--paper); }
.ring-summary { display: flex; align-items: center; justify-content: center; gap: 22px; margin: 0 0 18px; padding: 23px 15px; border-radius: var(--radius); background: var(--paper); }
.ring { --progress: 0%; flex-shrink: 0; width: clamp(132px, 38vw, 168px); height: clamp(132px, 38vw, 168px); border-radius: 50%; background: var(--soft); background: conic-gradient(from -90deg, var(--accent) 0 var(--progress), var(--soft) var(--progress) 100%); padding: 10px; }
.ring-inner { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; flex-direction: column; gap: 1px; border-radius: 50%; background: var(--paper); }
.ring-inner strong { font-size: clamp(29px, 8vw, 36px); font-weight: 730; line-height: 1.1; letter-spacing: -1.2px; font-variant-numeric: tabular-nums; }
.ring-inner small { color: var(--muted); font-size: 12px; }
.ring-side { min-width: 0; max-width: 155px; }
.ring-side > strong { display: block; font-size: clamp(27px, 7.5vw, 33px); font-weight: 700; line-height: 1.15; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.ring-side small, .ring-side > span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
.ring-side .text-btn { justify-content: flex-start; margin-top: 5px; padding-left: 0; font-size: 11px; text-align: left; font-weight: 450; }
.ring-summary.over .ring, .ring-summary[data-over="true"] .ring { background: conic-gradient(var(--danger) 0 100%); }
.ring-summary.over, .ring-summary[data-over="true"] { background: var(--danger-soft); }
.ring-summary.over .ring-side > strong, .ring-summary[data-over="true"] .ring-side > strong { color: var(--danger); }
.over-budget { margin: 18px 0; padding: 18px; border: 1px solid #d5968c; border-radius: 22px; background: var(--danger-soft); color: var(--danger); }
.over-heading { display: flex; align-items: center; gap: 8px; min-width: 0; }
.over-heading > svg { flex: 0 0 22px; width: 22px; height: 22px; }
.over-heading h2, .over-heading h3 { min-width: 0; font-size: 16px; overflow-wrap: anywhere; }
.over-amount { display: block; margin-top: 9px; font-size: 36px; font-weight: 730; line-height: 1.2; letter-spacing: -1px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.over-amount small, .over-amount > span { font-size: 14px; font-weight: 500; letter-spacing: 0; }
.over-budget > p:not(.over-amount) { margin-top: 7px; font-size: 12px; line-height: 1.5; }
.over-track { display: flex; width: 100%; height: 16px; margin-top: 17px; overflow: hidden; border-radius: 9px; background: #ecd8d1; }
.over-track > span, .over-track > div { display: block; height: 100%; min-width: 3px; }
.over-track .within-budget { background: #d8afa5; }
.over-track .over-segment { background: var(--danger); }
.over-legend { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 7px 12px; margin-top: 9px; font-size: 11px; line-height: 1.4; }
.over-legend > span { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
.over-legend > span::before { content: ""; flex: 0 0 7px; width: 7px; height: 7px; border-radius: 50%; background: #d8afa5; }
.over-legend > span:last-child::before { background: var(--danger); }
.favorite-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.favorite-card { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; min-height: 116px; padding: 12px 10px; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); text-align: left; }
.food-emoji { display: block; flex-shrink: 0; margin: 0 0 7px; font-size: 26px; line-height: 1.15; }
.favorite-card .food-name, .favorite-card b { display: -webkit-box; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 2; margin-bottom: 4px; font-size: 12px; font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; }
.favorite-card small, .favorite-card .tiny { margin-top: auto; color: var(--muted); font-size: 10px; }
.favorite-count { display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; min-width: 39px; min-height: 26px; padding: 3px 8px; border-radius: 20px; background: var(--soft); color: var(--accent); font-size: 11px; font-weight: 650; line-height: 1.2; font-variant-numeric: tabular-nums; }
.favorite-limit { margin: 12px 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 15px; background: var(--soft); color: var(--ink); font-size: 12px; line-height: 1.5; }
.entry-display { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 68px; padding: 10px 3px 12px; }
.entry-display > div { min-width: 0; }
.entry-display strong, .entry-display output { font-size: 34px; font-weight: 680; line-height: 1.1; letter-spacing: -.8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.entry-display small { color: var(--muted); font-size: 12px; font-weight: 400; letter-spacing: 0; }
.keypad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin: 0 0 11px; }
.keypad button { display: grid; place-items: center; min-height: 52px; padding: 9px; border: 0; border-radius: 15px; background: var(--key); color: var(--ink); font-size: 23px; font-weight: 500; }
.keypad button[data-key="C"], .keypad button[data-key="clear"], .keypad button[data-key="del"], .keypad button[data-key="backspace"], .keypad .key-secondary { color: var(--muted); font-size: 17px; }
.meal-entries, .weight-list, .day-list, .food-list { padding: 0; list-style: none; }
.entry-row { display: flex; align-items: center; gap: 10px; min-height: 76px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.entry-row > .food-emoji { margin: 0; font-size: 23px; }
.entry-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.entry-text strong, .entry-text b { display: block; font-size: 14px; }
.entry-text .small, .entry-text small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
.entry-quantity { display: inline-flex; align-items: center; justify-content: flex-start; gap: 5px; max-width: 100%; min-height: 44px; margin: 5px 0 0; padding: 6px 8px; border: 0; border-radius: 10px; background: var(--soft); color: var(--accent); font-size: 11px; font-weight: 550; line-height: 1.35; text-align: left; overflow-wrap: anywhere; }
.entry-quantity svg { width: 14px; height: 14px; }
.entry-actions { display: flex; flex-shrink: 0; align-items: center; gap: 2px; }
.entry-calories { flex-shrink: 0; color: var(--ink); font-size: 15px; font-weight: 650; line-height: 1.3; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.entry-calories small { display: block; margin-top: 1px; color: var(--muted); font-size: 10px; font-weight: 400; }
.entry-actions .icon-btn { border: 0; background: transparent; color: var(--muted); }
.entry-actions strong { font-size: 14px; font-variant-numeric: tabular-nums; }
.entry-actions small { font-size: 10px; color: var(--muted); }
.tabbar {
  position: fixed;
  z-index: 20;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 2px;
  width: 100%;
  max-width: 480px;
  min-height: calc(var(--nav-height) + env(safe-area-inset-bottom, 0px));
  padding: 9px 10px calc(9px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line);
  background: var(--bg);
}
.tabbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-width: 0; min-height: 56px; padding: 7px 1px; border: 0; border-radius: 14px; background: transparent; color: var(--muted); font-size: 10px; line-height: 1.2; }
.tabbar button svg { width: 21px; height: 21px; }
.tabbar button[aria-current="page"], .tabbar button[aria-selected="true"], .tabbar button.active { background: var(--soft); color: var(--accent); font-weight: 650; }
.searchbox { display: flex; align-items: center; gap: 9px; margin: 15px 0 12px; padding: 0 13px; border: 1px solid var(--line); border-radius: 15px; background: var(--paper); }
.searchbox svg { width: 19px; height: 19px; color: var(--muted); flex-shrink: 0; }
.searchbox input { width: 100%; min-width: 0; min-height: 50px; padding: 10px 0; border: 0; border-radius: 0; background: transparent; font-size: 16px; }
.searchbox:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.searchbox input:focus-visible { outline: none; }
.segmented { display: flex; gap: 5px; margin: 13px 0 16px; padding: 4px; border-radius: 15px; background: var(--soft); }
.segmented button { flex: 1; min-width: 0; min-height: 44px; padding: 9px 7px; border: 0; border-radius: 11px; background: transparent; font-size: 12px; font-weight: 550; }
.segmented button[aria-pressed="true"], .segmented button[aria-selected="true"], .segmented button.active { background: var(--paper); color: var(--accent); box-shadow: 0 2px 8px #16302008; }
.food-list { display: flex; flex-direction: column; gap: 9px; margin: 0; }
.food-list + .secondary { margin-top: 17px; }
.food-row { display: flex; align-items: center; gap: 0; min-width: 0; padding: 6px; border: 1px solid var(--line); border-radius: 19px; background: var(--paper); }
.food-main { display: flex; flex: 1; align-items: center; gap: 10px; min-width: 0; min-height: 62px; padding: 8px 6px; border: 0; border-radius: 13px; background: transparent; text-align: left; }
.food-main > span:not(.food-emoji), .food-main > div { min-width: 0; }
.food-main .food-emoji { margin: 0; font-size: 26px; }
.food-main .food-name, .food-main strong, .food-main b { display: block; font-size: 13px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.food-meta { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
.star { display: grid; place-items: center; flex-shrink: 0; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 13px; background: transparent; color: var(--muted); font-size: 21px; }
.star[aria-pressed="true"], .star.active { color: var(--accent); background: var(--soft); }
.food-row > .icon-btn { width: 44px; height: 44px; border: 0; background: transparent; color: var(--muted); }
.food-row > .star[aria-pressed="true"] { background: var(--soft); color: var(--accent); }
.food-row > .star[aria-pressed="true"] svg { fill: currentColor; }
.food-row > .star:disabled { background: transparent; color: var(--muted); opacity: .4; }
.weight-summary { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 6px 12px; margin: 6px 0 20px; }
.weight-summary > :first-child { grid-column: 1; grid-row: 1; }
.weight-summary > strong { grid-column: 1 / -1; grid-row: 2; }
.weight-summary > :last-child:not(:first-child) { grid-column: 2; grid-row: 1; max-width: 180px; }
.weight-summary strong { display: block; font-size: 43px; line-height: 1.15; font-weight: 720; letter-spacing: -1.7px; font-variant-numeric: tabular-nums; }
.weight-summary strong small { font-size: 16px; font-weight: 400; letter-spacing: 0; color: var(--muted); }
.weight-summary p, .weight-summary .small { margin-top: 4px; color: var(--muted); font-size: 12px; }
.weight-summary > :last-child:not(:first-child) { text-align: right; }
svg.weight-chart { display: block; width: 100%; max-width: 100%; height: 220px; overflow: visible; color: var(--accent); }
.weight-chart text { font-family: inherit; fill: var(--muted); font-size: 11px; }
.weight-chart .grid { stroke: var(--line); }
.weight-chart .line { stroke: var(--accent); fill: none; }
.weight-chart .point { fill: var(--accent); stroke: var(--paper); stroke-width: 2px; }
figure > figcaption { margin: 10px 0 0; color: var(--muted); font-size: 11px; }
.weight-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 65px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.weight-row > :first-child { min-width: 0; }
.weight-row strong { font-size: 16px; font-variant-numeric: tabular-nums; }
.weight-row .icon-btn { border: 0; background: transparent; color: var(--muted); }
.weight-row button:not(.icon-btn) { border: 0; background: transparent; text-align: left; }
.day-list { display: flex; flex-direction: column; gap: 10px; margin: 18px 0; }
.day-row { display: block; width: 100%; padding: 16px; border: 1px solid var(--line); border-radius: 19px; background: var(--paper); color: var(--ink); text-align: left; }

  function drawWeight(){

  function portionDialog(id){const f=findFood(id);if(!f)return;modal(f.name,'<p class="small muted">'+esc(f.emoji||'🍽️')+' '+num(f.kcal,1)+' kcal '+esc(basisLabel(f))+'</p>'+quantityControl('Quantité · '+amountUnit(f),'amount',f.defaultAmount)+field('Date de consommation','date',ui.date,'date','max="'+C.localDate()+'" required')+'<div class="portion-result"><strong id="portion-total">'+num(C.portionCalories(f,f.defaultAmount),1)+'</strong> kcal</div><p class="source-note">'+sourceHTML(f.source)+'</p>',submit('Ajouter à cette journée'),'portion-form',{foodId:id});}

  function foodDialog(id){const f=id?state.foods.find(x=>x.id===id):null;if(id&&!f)return;const favorite=f?state.settings.favoriteIds.includes(f.id):state.settings.favoriteIds.length<C.MAX_FAVORITES,full=state.settings.favoriteIds.length>=C.MAX_FAVORITES&&!favorite;modal(f?'Modifier mon aliment':'Mon nouvel aliment',field('Nom','name',f?.name||'','text','maxlength="120" required')+emojiPicker(f?.emoji||'🍽️')+field('Calories de référence · kcal','kcal',f?.kcal??'','text','inputmode="decimal" required')+'<label class="field"><span>Ces calories correspondent à</span><select name="basis" aria-label="Ces calories correspondent à">'+[['portion','1 portion'],['100g','100 grammes'],['100ml','100 millilitres']].map(([v,t])=>'<option value="'+v+'" '+((f?.basis||'portion')===v?'selected':'')+'>'+t+'</option>').join('')+'</select></label>'+field('Nom de la portion (si applicable)','portionName',f?.portionName||'portion','text','maxlength="80"')+field('Quantité proposée lors d’un ajout','defaultAmount',f?.defaultAmount??1,'text','inputmode="decimal" required')+'<p class="form-note">Exemple : café au lait, 40 kcal pour 1 tasse. Au moment de l’ajout, choisis 3 tasses pour enregistrer 120 kcal.</p><label class="favorite-choice"><input type="checkbox" name="favorite" '+(favorite?'checked':'')+' '+(full?'disabled':'')+'> Afficher dans mes favoris</label><p class="favorite-limit small muted">'+favoriteLimitText()+'</p>',submit('Enregistrer cet aliment')+(f?'<button type="button" class="text-btn danger" data-delete-food="'+esc(id)+'">Supprimer cet aliment</button>':''),'food-form',{foodId:id||null});}

  function entryDialog(id,date){const e=state.days[date]?.entries.find(x=>x.id===id);if(!e)return;const q=C.entryQuantity(e);modal('Modifier cet ajout',field('Aliment ou repas','name',e.name,'text','maxlength="120" required')+quantityControl('Quantité · '+q.quantityUnit,'quantity',q.quantity)+field('Calories pour 1 '+q.quantityUnit,'unitKcal',q.unitKcal,'text','inputmode="decimal" required')+'<div class="portion-result"><strong id="entry-total">'+num(e.kcal,2)+'</strong> kcal</div>'+(e.quantity===undefined?'<p class="form-note">Cet ancien ajout compte comme 1 portion de '+num(e.kcal,2)+' kcal. Son total est conservé ; augmente la quantité pour le multiplier.</p>':'')+field('Portion ou note (facultatif)','portion',e.portion,'text','maxlength="160"')+field('Date','date',date,'date','max="'+C.localDate()+'" required'),submit('Enregistrer la correction'),'entry-form',{entryId:id,date,quantityUnit:q.quantityUnit});}


  function errorIn(form,error){form.querySelector('.form-error').textContent=error.message||String(error);}
  function numberIn(value,label,min,max){const n=C.decimal(value);if(!Number.isFinite(n)||n<min||n>max)throw Error(label+' : indique une valeur entre '+min+' et '+max+'.');return n;}
  function checkedDate(value){if(!C.validDate(value)||value>C.localDate())throw Error('Choisis une date passée ou aujourd’hui.');return value;}
  async function exportBackup(){
    const blob=new Blob([JSON.stringify(C.makeBackup(state),null,2)],{type:'application/json'});if(blob.size>5*1024*1024){const error=Error('Ce carnet dépasse la limite de sauvegarde de 5 Mo. Aucune donnée n’a été effacée.');if(dialog.open)errorIn(dialog.querySelector('form'),error);tell(error.message);return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pomme-sauvegarde-'+C.localDate()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
    await save(d=>{d.lastBackupAt=new Date().toISOString();},'Sauvegarde préparée. Conserve le fichier téléchargé dans Fichiers ou iCloud Drive.');
  }
  async function prepareImport(file){if(!file)return;try{if(file.size>5*1024*1024)throw Error('Le fichier dépasse 5 Mo.');const incoming=C.parseBackup(await file.text());const count=Object.values(incoming.days).reduce((n,d)=>n+d.entries.length,0);modal('Restaurer ma sauvegarde','<p>Ce fichier contient <b>'+count+' ajouts</b>, <b>'+incoming.weights.length+' pesées</b> et <b>'+incoming.foods.length+' aliments personnels</b>.</p><p class="notice">La restauration remplace tout le carnet présent sur cet appareil. Exporte-le d’abord si tu souhaites le conserver.</p><button type="button" class="secondary" data-action="export">Exporter le carnet actuel</button>',submit('Remplacer mon carnet')+'<button type="button" class="text-btn" data-action="close-dialog">Annuler</button>','import-form',{incoming});}catch(e){tell('Sauvegarde non restaurée : '+e.message);}}
  function updateWeightHint(){const form=document.getElementById('weight-form');if(!form)return;const existing=state.weights.find(w=>w.date===ui.weightDate);document.getElementById('existing-weight').textContent=existing?'Mesure existante : '+kg(existing.kg)+' kg.':'';document.getElementById('save-weight').textContent=existing?'Mettre à jour cette pesée':'Ajouter cette pesée';}
  document.addEventListener('input',e=>{
    const t=e.target;
    if(t.closest('#settings-form')){const form=t.closest('form');ui.profileDraft=Object.fromEntries(new FormData(form));form.querySelector('[data-profile-avatar]').textContent=ui.profileDraft.avatar;form.querySelector('[data-profile-name]').textContent=ui.profileDraft.username||'Bienvenue';}
    if(t.closest('#quota-form'))ui.quotaDraft=t.value;
    if(t.id==='entry-name')ui.entryName=t.value;
    if(t.id==='quick-quantity'){ui.quantity=t.value;updateQuick();}
    if(t.closest('#entry-form')&&['quantity','unitKcal'].includes(t.name)){try{const f=t.closest('form');document.getElementById('entry-total').textContent=num(C.quantityCalories(C.decimal(f.elements.unitKcal.value),C.decimal(f.elements.quantity.value)),2);f.querySelector('.form-error').textContent='';}catch(error){document.getElementById('entry-total').textContent='—';errorIn(t.closest('form'),error);}}
    if(t.id==='food-search'){ui.search=t.value;document.getElementById('food-list').innerHTML=foodRows();}
    if(t.closest('#weight-form')){if(t.name==='kg')ui.weightInput=t.value;if(t.name==='date'){ui.weightDate=t.value;updateWeightHint();}}
    if(t.closest('#portion-form')&&t.name==='amount'){const f=findFood(ui.dialog?.foodId),amount=C.decimal(t.value);try{document.getElementById('portion-total').textContent=Number.isFinite(amount)&&amount>0?num(C.portionCalories(f,amount),1):'—';dialog.querySelector('.form-error').textContent='';}catch(error){document.getElementById('portion-total').textContent='—';errorIn(dialog.querySelector('form'),error);}}
  });
  document.addEventListener('change',e=>{const t=e.target;if(t.id==='day-date'){try{ui.date=checkedDate(t.value);render();}catch(error){tell(error.message);t.value=ui.date;}}if(t.id==='import-file')prepareImport(t.files[0]);if(t.closest('#food-form')&&t.name==='basis'){const form=t.closest('form');form.elements.defaultAmount.value=t.value==='portion'?'1':'100';}if(t.closest('#food-form')&&t.name==='emoji')t.closest('form').querySelector('[data-food-icon-label]').textContent=t.getAttribute('aria-label');});
  document.addEventListener('click',async e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.settings){ui.settingsSection=b.dataset.settings;go('settings');return;}
    if(b.dataset.tab){if(b.dataset.tab==='settings')ui.settingsSection='overview';go(b.dataset.tab);return;}
    const a=b.dataset.action;
    if(a==='close-dialog'){closeDialog();return;}if(a==='dismiss-toast'){toastEl.hidden=true;return;}
    if(busy)return;
    if(b.dataset.historyDate){selectHistoryDate(b.dataset.historyDate);return;}
    if(b.dataset.historyMonth){changeHistoryMonth(Number(b.dataset.historyMonth));return;}
    if(b.dataset.quantityStep){const input=document.getElementById(b.dataset.target),current=C.decimal(input.value),next=(Number.isFinite(current)?current:0)+Number(b.dataset.quantityStep);if(next>0&&next<=100000){input.value=String(Math.round(next*100)/100);input.dispatchEvent(new Event('input',{bubbles:true}));}return;}
    if(b.dataset.key){const k=b.dataset.key;ui.digits=k==='C'?'':k==='delete'?ui.digits.slice(0,-1):(ui.digits==='0'?'':ui.digits)+k;ui.digits=ui.digits.slice(0,5);updateQuick();return;}
    if(b.dataset.portion){portionDialog(b.dataset.portion);return;}
    if(b.dataset.filter){ui.foodFilter=b.dataset.filter;render();return;}
    if(b.dataset.favorite){const id=b.dataset.favorite;await save(d=>{C.setFavorite(d,id,!d.settings.favoriteIds.includes(id));});return;}
    if(b.dataset.editFood){foodDialog(b.dataset.editFood);return;}
    if(b.dataset.editEntry){entryDialog(b.dataset.editEntry,b.dataset.date);return;}
    if(b.dataset.deleteEntry){const id=b.dataset.deleteEntry,date=b.dataset.date;let removed;const ok=await save(d=>{const day=d.days[date],i=day?.entries.findIndex(x=>x.id===id);if(i==null||i<0)throw Error('Cet ajout n’existe plus.');removed=day.entries.splice(i,1)[0];},null,()=>{});if(ok)tell('Ajout retiré.',{label:'Annuler',run:()=>save(d=>{const day=ensureDay(d,date);if(!day.entries.some(x=>x.id===removed.id))day.entries.push(removed);},'Ajout rétabli.')});return;}
    if(b.dataset.openDay){ui.date=b.dataset.openDay;go('day');return;}
    if(b.dataset.editWeight){const r=state.weights.find(w=>w.date===b.dataset.editWeight);if(r){ui.weightEdit=r.date;ui.weightDate=r.date;ui.weightInput=String(r.kg);render();document.querySelector('#weight-form input[name="kg"]').focus();}return;}
    if(b.dataset.deleteWeight){const date=b.dataset.deleteWeight;let removed;const ok=await save(d=>{const i=d.weights.findIndex(w=>w.date===date);if(i<0)throw Error('Cette pesée n’existe plus.');removed=d.weights.splice(i,1)[0];},null,()=>{if(ui.weightEdit===date){ui.weightEdit=null;ui.weightDate=C.localDate();ui.weightInput='';}});if(ok)tell('Pesée retirée.',{label:'Annuler',run:()=>save(d=>{if(d.weights.some(w=>w.date===date))throw Error('Une pesée existe déjà à cette date.');d.weights.push(removed);},'Pesée rétablie.')});return;}
    if(b.dataset.deleteFood){const f=findFood(b.dataset.deleteFood);modal('Supprimer cet aliment ?','<p>'+esc(f.name)+'</p><p class="small muted">Les calories déjà ajoutées à ton historique seront conservées.</p>',submit('Supprimer cet aliment')+'<button type="button" class="text-btn" data-action="close-dialog">Annuler</button>','delete-food-form',{foodId:f.id});return;}
    if(a==='new-food')foodDialog();
    if(a==='previous-day'){ui.date=shiftDate(ui.date,-1);render();}if(a==='next-day'&&ui.date<C.localDate()){ui.date=shiftDate(ui.date,1);render();}if(a==='today'){ui.date=C.localDate();render();}if(a==='open-selected-day'){ui.date=ui.historyDate;go('day');}
    if(a==='add-calories'&&quickTotal()!==null){const quantity=C.decimal(ui.quantity),unitKcal=Number(ui.digits),entry={id:uid(),name:ui.entryName.trim()||'Ajout libre',portion:'',kcal:C.quantityCalories(unitKcal,quantity),quantity,unitKcal,quantityUnit:'portion',createdAt:new Date().toISOString()},date=ui.date;await save(d=>{ensureDay(d,date).entries.push(entry);},'Calories ajoutées.',()=>{ui.digits='';ui.entryName='';ui.quantity='1';});}
    if(a==='cancel-weight'){ui.weightEdit=null;ui.weightDate=C.localDate();ui.weightInput='';render();}
    if(a==='export')await exportBackup();if(a==='choose-import')document.getElementById('import-file').click();
    if(a==='toast-action'){const action=toastAction;toastEl.hidden=true;toastAction=null;if(action)await action.run();}
    if(a==='persist'){try{storagePersistent=!!(await navigator.storage?.persist?.());render();tell(storagePersistent?'Le navigateur a accordé le stockage persistant. Garde aussi une copie de secours.':'Cette option n’a pas été accordée par le navigateur. Utilise l’export pour garder une copie de secours.');}catch{tell('Conserve une copie de secours avec le bouton Exporter.');}}
    if(a==='share'){const url=location.origin+location.pathname;try{if(navigator.share)await navigator.share({title:'Pomme — Calories & poids',url});else if(navigator.clipboard){await navigator.clipboard.writeText(url);tell('Lien de Pomme copié.');}else modal('Le lien de Pomme',field('À copier et partager','url',url,'text','readonly'),'<button type="button" class="primary" data-action="close-dialog">Fermer</button>','share-form');}catch(error){if(error.name!=='AbortError')tell('Copie le lien dans la barre d’adresse de Safari.');}}
    if(a==='retry')location.reload();
  });
  document.addEventListener('submit',async e=>{
    const form=e.target;if(!form.id)return;e.preventDefault();if(busy)return;
    const data=new FormData(form),v=name=>String(data.get(name)??'').trim();
    try{
      form.querySelector('.form-error').textContent='';
      if(form.id==='portion-form'){const f=findFood(ui.dialog.foodId),amount=numberIn(v('amount'),'Quantité',.01,100000),date=checkedDate(v('date'));if(!f)throw Error('Cet aliment n’existe plus.');const entry={id:uid(),name:f.name,kcal:C.portionCalories(f,amount),portion:'',quantity:amount,unitKcal:f.kcal/(f.basis==='portion'?1:100),quantityUnit:amountUnit(f),createdAt:new Date().toISOString(),foodId:f.id};await save(d=>{ensureDay(d,date).entries.push(entry);},'Aliment ajouté au '+fmtDate(date,true)+'.',()=>{ui.date=date;closeDialog();});}
      if(form.id==='food-form'){const id=ui.dialog.foodId,old=id?state.foods.find(x=>x.id===id):null,basis=v('basis');if(!v('name'))throw Error('Donne un nom à ton aliment.');const f={id:id||uid(),name:v('name'),kcal:numberIn(v('kcal'),'Calories',0,100000),basis,portionName:basis==='portion'?v('portionName'):basis==='100ml'?'ml':'g',defaultAmount:numberIn(v('defaultAmount'),'Quantité',.01,100000),emoji:v('emoji')||old?.emoji||'🍽️',source:'Saisie personnelle'};if(basis==='portion'&&!f.portionName)throw Error('Indique le nom de la portion.');await save(d=>{if(id){const i=d.foods.findIndex(x=>x.id===id);if(i<0)throw Error('Cet aliment n’existe plus.');d.foods[i]=f;}else{d.foods.push(f);}C.setFavorite(d,f.id,data.get('favorite')==='on');},'Aliment enregistré.',closeDialog);}
      if(form.id==='entry-form'){const id=ui.dialog.entryId,from=ui.dialog.date,date=checkedDate(v('date')),quantity=numberIn(v('quantity'),'Quantité',.01,100000),unitKcal=numberIn(v('unitKcal'),'Calories par unité',0,100000),quantityUnit=ui.dialog.quantityUnit,kcal=C.quantityCalories(unitKcal,quantity),name=v('name'),portion=v('portion');if(!name)throw Error('Indique le nom de cet ajout.');await save(d=>{const i=d.days[from]?.entries.findIndex(x=>x.id===id);if(i==null||i<0)throw Error('Cet ajout n’existe plus.');const entry=d.days[from].entries.splice(i,1)[0];ensureDay(d,date).entries.push({...entry,name,portion,kcal,quantity,unitKcal,quantityUnit});},'Correction enregistrée.',()=>{ui.date=date;closeDialog();});}
      if(form.id==='settings-form'){await save(d=>{d.settings.username=v('username');d.settings.avatar=v('avatar')||'🍎';},'Profil enregistré.',()=>{ui.profileDraft=null;ui.date=C.localDate();ui.tab='day';window.scrollTo({top:0,behavior:'instant'});});}
      if(form.id==='quota-form'){const limit=numberIn(v('limit'),'Plafond',1,20000);if(!Number.isInteger(limit))throw Error('Indique un plafond en calories entières.');await save(d=>{d.settings.limit=limit;const today=C.localDate();if(d.days[today])d.days[today].limit=limit;},'Quota enregistré.',()=>{ui.quotaDraft=null;});}
      if(form.id==='weight-form'){const date=checkedDate(v('date')),value=numberIn(v('kg'),'Poids',1,1000),oldDate=ui.weightEdit;if(Math.abs(value*100-Math.round(value*100))>.000001)throw Error('Utilise au maximum deux chiffres après la virgule.');await save(d=>{if(oldDate&&oldDate!==date&&d.weights.some(w=>w.date===date))throw Error('Une pesée existe déjà à cette nouvelle date. Modifie-la directement.');if(oldDate&&oldDate!==date)d.weights=d.weights.filter(w=>w.date!==oldDate);const i=d.weights.findIndex(w=>w.date===date),r={date,kg:value};if(i<0)d.weights.push(r);else d.weights[i]=r;},'Pesée enregistrée : '+kg(value)+' kg le '+fmtDate(date,true)+'.',()=>{ui.weightEdit=null;ui.weightDate=C.localDate();ui.weightInput='';});}
      if(form.id==='delete-food-form'){const id=ui.dialog.foodId;await save(d=>{d.foods=d.foods.filter(f=>f.id!==id);d.settings.favoriteIds=d.settings.favoriteIds.filter(x=>x!==id);},'Aliment personnel supprimé.',closeDialog);}
      if(form.id==='import-form'){const incoming=ui.dialog.incoming;await save(()=>incoming,'Sauvegarde restaurée.',()=>{ui.profileDraft=null;ui.quotaDraft=null;ui.date=C.localDate();ui.digits='';ui.entryName='';ui.quantity='1';ui.weightEdit=null;ui.weightInput='';ui.weightDate=C.localDate();closeDialog();});}
    }catch(error){errorIn(form,error);}
  });
  dialog.addEventListener('cancel',()=>{ui.dialog=null;});
  async function refresh(){if(busy||!db)return;try{const latest=await C.readDB(db);if(latest&&latest.updatedAt!==state.updatedAt){state=latest;render();}const today=C.localDate();if(today!==lastToday){if(ui.historyDate===lastToday){ui.historyDate=today;ui.historyMonth=today.slice(0,7);}if(ui.date===lastToday&&!ui.digits&&!ui.entryName)ui.date=today;if(ui.weightDate===lastToday&&!ui.weightInput&&!ui.weightEdit)ui.weightDate=today;lastToday=today;render();}}catch{setStatus('Relecture impossible',true);}}
  async function start(){deviceButton.disabled=true;try{db=await C.openDB();const existing=await C.readDB(db);if(existing)state=existing;else{state.settings.favoriteIds=['ciqual-13039','ciqual-19593','ciqual-7110'];await C.writeDB(db,state);}storagePersistent=!!(await navigator.storage?.persisted?.());deviceButton.disabled=false;render();setStatus('Sur cet appareil');if('BroadcastChannel' in window){channel=new BroadcastChannel('pomme-data');channel.onmessage=refresh;}window.addEventListener('focus',refresh);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh();});setInterval(refresh,60000);if('serviceWorker'in navigator&&(location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname)))navigator.serviceWorker.register('./sw.js').catch(()=>{});}catch(error){deviceButton.disabled=true;setStatus('Stockage indisponible',true);main.innerHTML='<div class="error-panel"><h1>Ton carnet ne peut pas s’ouvrir</h1><p>Pomme a besoin du stockage de ce navigateur pour conserver tes données. Vérifie que le stockage du site est autorisé, puis réessaie.</p><p class="small muted">'+esc(error.message)+'</p><button class="primary" data-action="retry">Réessayer</button></div>';}}
  start();
})();
</script>
